# ========================================================
# Spring Boot Configuration para PRODUCCIÓN (Render)
# ========================================================
# Archivo: backend/agora-backend/src/main/resources/application-prod.properties

# ========================================================
# SERVER
# ========================================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ========================================================
# DATABASE (PostgreSQL en Render o Supabase)
# ========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========================================================
# JPA/HIBERNATE
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========================================================
# LOGGING
# ========================================================
logging.level.root=INFO
logging.level.com.udea=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ========================================================
# OAUTH2 GOOGLE
# ========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# ========================================================
# JWT
# ========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ========================================================
# CORS
# ========================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# ========================================================
# SCHEDULER
# ========================================================
app.scheduler.convocatorias-expiradas.cron=0 0 1 * * *

# ========================================================
# ACTUATOR (Health checks y métricas)
# ========================================================
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true
management.metrics.enable.process=true
