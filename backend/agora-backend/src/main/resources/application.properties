spring.application.name=agora-backend
spring.config.import=optional:file:.env
# Credenciales de Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Login de pruebas con usuarios precargados (oauth_id "seed-..."). Vacío = deshabilitado.
# Requiere al menos 16 caracteres. Vaciar antes de la entrega.
app.login-pruebas.clave=${APP_LOGIN_PRUEBAS_CLAVE:}

# URL frontend
app.frontend.url=http://localhost:3000
# Orígenes que pueden llamar a la API desde el navegador (separados por coma)
app.cors.allowed-origins=${APP_CORS_ORIGINS:${app.frontend.url}}

# Plazo (días) que tiene un estudiante para responder una oferta pre-aprobada
app.ofertas.dias-respuesta=${APP_OFERTAS_DIAS_RESPUESTA:3}
# Minutos que el árbol KD de "Semilleros similares" se reutiliza antes de reconstruirse.
# Los cambios hechos desde la app lo invalidan al instante; esto cubre los cambios por SQL.
app.recomendacion.kd.vigencia-minutos=${APP_RECOMENDACION_KD_VIGENCIA_MINUTOS:15}

# Pesos de los algoritmos (config/Pesos*.java). Cada grupo debe sumar 1; si no, la app no arranca.
# Motor de recomendación: habilidades, áreas de tutores, convocatoria abierta, proximidad temática
app.recomendacion.pesos.habilidades=0.40
app.recomendacion.pesos.areas-tutores=0.25
app.recomendacion.pesos.convocatoria-abierta=0.20
app.recomendacion.pesos.proximidad-tematica=0.15
app.recomendacion.pesos.lineas-en-proximidad=0.75
app.recomendacion.pesos.programa-en-proximidad=0.25
# Priorización de candidatos
app.priorizacion.pesos.tematica=0.35
app.priorizacion.pesos.habilidades=0.25
app.priorizacion.pesos.disponibilidad=0.20
app.priorizacion.pesos.compromiso=0.20
# Semilleros similares (árbol KD): peso de los semilleros actuales y anteriores del historial
app.recomendacion.kd.pesos.actual=1.0
app.recomendacion.kd.pesos.anterior=0.5
# Cron que expira las ofertas vencidas (por defecto, cada hora)
app.scheduler.ofertas-vencidas.cron=0 0 * * * *

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Cron de cierre/expiración automática de convocatorias (Servicio 2).
# Formato Spring (seg min hora dia-mes mes dia-semana). Por defecto: 1:00 AM todos los días.
app.scheduler.convocatorias-expiradas.cron=0 0 1 * * *

# Configuración de Base de Datos (Supabase / PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# para que Spring Boot no intente sobreescribirlas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
# Carga las relaciones perezosas de hasta 50 entidades por consulta (evita N+1 en los listados)
spring.jpa.properties.hibernate.default_batch_fetch_size=50