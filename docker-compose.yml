version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agora-postgres
    environment:
      POSTGRES_DB: agora_database
      POSTGRES_USER: agora_user
      POSTGRES_PASSWORD: agora_password_dev
      POSTGRES_INITDB_ARGS: "-c max_connections=100"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora_user -d agora_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agora-network

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora-backend
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agora_database
      SPRING_DATASOURCE_USERNAME: agora_user
      SPRING_DATASOURCE_PASSWORD: agora_password_dev
      
      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_PROFILES_ACTIVE: dev
      
      # OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-client-secret}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      
      # Frontend
      APP_FRONTEND_URL: http://localhost:5173
      
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_UDEA: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agora-network
    volumes:
      # Opcional: hot reload en desarrollo
      - ./backend/agora-backend/src:/app/src

  # pgAdmin (herramienta para gestionar PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:7.5
    container_name: agora-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agora.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - agora-network

networks:
  agora-network:
    driver: bridge

volumes:
  postgres_data:
